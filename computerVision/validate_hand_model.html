<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Camera Demo + Hand Detection</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    .row { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; flex-wrap: wrap; }
    select, button, label { padding: .5rem .75rem; }
    .stage { position: relative; width: 100%; max-width: 680px; }
    video, canvas.overlay { width: 100%; border-radius: 12px; display: block; }
    canvas.overlay { position: absolute; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Camera → Webpage (with Hand Detection)</h1>

  <div class="row">
    <button id="start">Start (rear camera)</button>
    <select id="cameraSelect" title="Choose camera"></select>
    <button id="stop" disabled>Stop</button>
    <button id="snap">Capture JPG</button>
    <label><input type="checkbox" id="live"> Live detect</label>
    <button id="detectOnce">Detect once</button>
  </div>

  <div class="stage">
    <video id="preview" playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
  </div>

  <!-- Hidden canvas for per-frame processing (snapshots, etc.) -->
  <canvas id="frame" hidden></canvas>

  <script type="module">
    // --- UI refs
    const video   = document.getElementById('preview');
    const overlay = document.getElementById('overlay');
    const octx    = overlay.getContext('2d');

    const startBtn = document.getElementById('start');
    const stopBtn  = document.getElementById('stop');
    const camSel   = document.getElementById('cameraSelect');
    const snapBtn  = document.getElementById('snap');
    const liveChk  = document.getElementById('live');
    const onceBtn  = document.getElementById('detectOnce');

    const frameCanvas = document.getElementById('frame');
    const frameCtx    = frameCanvas.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let currentDeviceId = null;
    let usingFront = false;

    // --- Camera helpers
    async function listCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      camSel.innerHTML = '';
      cams.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${i+1}`;
        camSel.appendChild(opt);
      });
      if (currentDeviceId) camSel.value = currentDeviceId;
    }

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      stopBtn.disabled = true;
    }

    function resizeOverlayToVideo() {
      const w = video.videoWidth, h = video.videoHeight;
      if (!w || !h) return;
      overlay.width = w;
      overlay.height = h;
    }

    async function startStream(constraints) {
      try {
        stopStream();
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        stopBtn.disabled = false;
        await listCameras();

        // Determine whether front cam is used (mirror video & overlay for display)
        usingFront = constraints?.video?.facingMode === 'user'
                  || constraints?.video?.facingMode?.ideal === 'user'
                  || constraints?.video?.deviceId?.exact === 'front';
        const mirror = usingFront ? 'scaleX(-1)' : 'none';
        video.style.transform   = mirror;
        overlay.style.transform = mirror;

        // Size overlay to the actual video frame
        resizeOverlayToVideo();
      } catch (err) {
        alert('Camera error: ' + (err?.message || err));
        console.error(err);
      }
    }

    // Extract a JPEG Blob from the current video frame
    async function captureJpegFromVideo(video, {quality = 0.92} = {}) {
      const w = video.videoWidth, h = video.videoHeight;
      frameCanvas.width = w; frameCanvas.height = h;
      // If preview is mirrored (front cam), un-mirror for the saved image if desired:
      frameCtx.setTransform(1, 0, 0, 1, 0, 0);
      frameCtx.drawImage(video, 0, 0, w, h);
      const blob = await new Promise(res => frameCanvas.toBlob(res, 'image/jpeg', quality));
      return blob; // 'image/jpeg'
    }

    async function downloadSnapshot() {
      const blob = await captureJpegFromVideo(video, {quality: 0.92});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[:.]/g, '-');
      a.href = url; a.download = `frame-${ts}.jpg`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    // --- Hand Landmarker (MediaPipe Tasks)
    import {
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );

    // Hosted task file (float16). You can host locally if preferred.
    const HAND_TASK_URL =
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task";

    const handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: HAND_TASK_URL, delegate: "GPU" },
      runningMode: "VIDEO",
      numHands: 2,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    const drawer = new DrawingUtils(octx);
    let lastVideoTime = -1;

    function clearOverlay() {
      octx.clearRect(0, 0, overlay.width, overlay.height);
    }

    function drawResults(result) {
      clearOverlay();
      if (!result) return;
      const { landmarks } = result;
      if (!landmarks) return;

      for (const hand of landmarks) {
        // Draw connectors & landmarks
        drawer.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS, { lineWidth: 2 });
        drawer.drawLandmarks(hand, { radius: 3 });
      }
    }

    // Live pump: runs when video is playing; gated by Live checkbox
    function pump() {
      if (!stream) return;
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        if (overlay.width !== w || overlay.height !== h) resizeOverlayToVideo();

        // Process at most once per video time step
        if (liveChk.checked) {
          const nowMs = performance.now();
          const vt = video.currentTime;
          if (vt !== lastVideoTime) {
            const result = handLandmarker.detectForVideo(video, nowMs);
            drawResults(result);
            lastVideoTime = vt;
          }
        }
      } else {
        clearOverlay();
      }
      requestAnimationFrame(pump);
    }

    // One-shot detection (on current frame)
    function detectOnce() {
      const nowMs = performance.now();
      const result = handLandmarker.detectForVideo(video, nowMs);
      drawResults(result);
    }

    // --- Wire up UI
    startBtn.addEventListener('click', async () => {
      await startStream({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 }, height: { ideal: 720 },
          frameRate: { ideal: 30, max: 60 }
        },
        audio: false
      });
    });

    camSel.addEventListener('change', async () => {
      currentDeviceId = camSel.value;
      await startStream({ video: { deviceId: { exact: currentDeviceId } }, audio: false });
    });

    stopBtn.addEventListener('click', () => { stopStream(); clearOverlay(); });

    onceBtn.addEventListener('click', detectOnce);
    snapBtn.addEventListener('click', downloadSnapshot);

    // Start the loop once video is ready
    video.addEventListener('playing', () => requestAnimationFrame(pump));
    window.addEventListener('resize', resizeOverlayToVideo);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { stopStream(); clearOverlay(); }
    });
    window.addEventListener('pagehide', () => { stopStream(); clearOverlay(); });
  </script>
</body>
</html>
