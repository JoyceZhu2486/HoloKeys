<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fingertip Refinement – Method 3 (Axis Search + Hull Mask)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header><strong>Fingertip Refinement (Method 3): Axis Search + Hand Hull Mask</strong></header>

  <main class="container">
    <!-- Toolbar on top -->
    <div class="toolbar" id="toolbar">
      <button id="btnStart">Start Camera</button>
      <label><input type="checkbox" id="chkLive"> Live Detect</label>
      <button id="btnDetectAndSave" disabled>Detect &amp; Save</button>
      <span class="status" id="status">Idle</span>
    </div>

    <!-- Scaled wrapper so video+overlay shrink together to fit screen -->
    <div class="stage-wrap" id="stageWrap">
      <section id="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <!-- Hidden raw canvas to grab RGBA frames for OpenCV -->
        <canvas id="raw" style="display:none;"></canvas>
      </section>
    </div>
  </main>

  <!-- OpenCV.js (loads async) -->
  <script src="https://docs.opencv.org/4.x/opencv.js" defer></script>
  <!-- MediaPipe Tasks Vision -->
  <script type="module" src="./app.js"></script>
</body>
</html>
