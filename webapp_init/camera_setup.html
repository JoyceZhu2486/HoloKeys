<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Camera Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    video { width: 100%; max-width: 680px; border-radius: 12px; display: block; }
    .row { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; flex-wrap: wrap; }
    select, button { padding: .5rem .75rem; }

    /* Editor styles */
    .editor-wrap { max-width: 680px; margin-top: 1rem; }
    #editor {
      width: 100%;
      min-height: 220px;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 12px;
      font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }
    #editor:focus { border-color: #6aa1ff; box-shadow: 0 0 0 3px rgba(100,150,255,.2); }
    .editor-toolbar { display:flex; gap:.5rem; margin:.5rem 0; }
  </style>
</head>
<body>
  <h1>Camera → Webpage</h1>

  <div class="row">
    <button id="start">Start (rear camera)</button>
    <select id="cameraSelect" title="Choose camera"></select>
    <button id="stop" disabled>Stop</button>
    <button id="snap">Capture JPG</button>
  </div>

  <video id="preview" playsinline muted></video>
  <!-- Hidden canvas for per-frame processing (send to your CV/ML) -->
  <canvas id="frame" hidden></canvas>

  <!-- Simple Text Editor -->
  <section class="editor-wrap">
    <div class="editor-toolbar">
      <button id="focusEditorBtn" type="button">Focus editor</button>
      <button id="clearEditorBtn" type="button">Clear</button>
    </div>
    <textarea id="editor" placeholder="Type here… or have your virtual keyboard call insertText()/pressKey()."></textarea>
  </section>

  <script>
    const video = document.getElementById('preview');
    const startBtn = document.getElementById('start');
    const stopBtn  = document.getElementById('stop');
    const camSel   = document.getElementById('cameraSelect');
    const canvas   = document.getElementById('frame');
    const ctx      = canvas.getContext('2d', { willReadFrequently: true });

    // --- Editor elements & helpers ---
    const editor = document.getElementById('editor');
    const focusEditorBtn = document.getElementById('focusEditorBtn');
    const clearEditorBtn = document.getElementById('clearEditorBtn');

    function focusEditor() { editor.focus(); }
    function setValueAndCaret(text, caretPos) {
      const wasFocused = document.activeElement === editor;
      editor.value = text;
      editor.dispatchEvent(new Event('input', { bubbles: true }));
      if (!wasFocused) editor.focus();
      editor.setSelectionRange(caretPos, caretPos);
    }
    // Programmatic typing for your virtual keyboard:
    function insertText(text) {
      const { selectionStart, selectionEnd, value } = editor;
      const before = value.slice(0, selectionStart);
      const after  = value.slice(selectionEnd);
      const next = before + text + after;
      const pos = before.length + text.length;
      setValueAndCaret(next, pos);
    }
    function pressKey(key) {
      const { selectionStart, selectionEnd, value } = editor;
      if (key === 'Backspace') {
        if (selectionStart !== selectionEnd) {
          setValueAndCaret(value.slice(0, selectionStart) + value.slice(selectionEnd), selectionStart);
        } else if (selectionStart > 0) {
          const pos = selectionStart - 1;
          setValueAndCaret(value.slice(0, pos) + value.slice(selectionEnd), pos);
        }
        return;
      }
      if (key === 'Delete') {
        if (selectionStart !== selectionEnd) {
          setValueAndCaret(value.slice(0, selectionStart) + value.slice(selectionEnd), selectionStart);
        } else if (selectionStart < value.length) {
          setValueAndCaret(value.slice(0, selectionStart) + value.slice(selectionStart + 1), selectionStart);
        }
        return;
      }
      if (key === 'Enter') { insertText('\n'); return; }
      if (key === 'Space') { insertText(' ');  return; }
      if (typeof key === 'string' && key.length === 1) insertText(key);
    }
    // Nice-to-haves: autosize + Tab inserts spaces
    editor.addEventListener('input', () => {
      editor.style.height = 'auto';
      editor.style.height = Math.min(editor.scrollHeight, 800) + 'px';
    });
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        insertText('  '); // 2 spaces
      }
    });
    focusEditorBtn.addEventListener('click', focusEditor);
    clearEditorBtn.addEventListener('click', () => { editor.value=''; editor.dispatchEvent(new Event('input')); focusEditor(); });

    let stream = null;
    let currentDeviceId = null;
    let usingFront = false;

    async function listCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      camSel.innerHTML = '';
      cams.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${i+1}`;
        camSel.appendChild(opt);
      });
      if (currentDeviceId) camSel.value = currentDeviceId;
    }

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      stopBtn.disabled = true;
    }

    async function startStream(constraints) {
      try {
        stopStream();
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        stopBtn.disabled = false;
        await listCameras();
        usingFront = constraints?.video?.facingMode === 'user'
                  || constraints?.video?.facingMode?.ideal === 'user';
        video.style.transform = usingFront ? 'scaleX(-1)' : 'none';
        // optional: focus editor after camera starts
        focusEditor();
      } catch (err) {
        alert('Camera error: ' + (err?.name || err?.message || err));
        console.error(err);
      }
    }

    function pump() {
      if (!stream) return;
      const w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        canvas.width = w;
        canvas.height = h;
        if (usingFront) {
          ctx.save(); ctx.scale(-1,1); ctx.drawImage(video, -w, 0, w, h); ctx.restore();
        } else {
          ctx.drawImage(video, 0, 0, w, h);
        }
        // const pixels = ctx.getImageData(0, 0, w, h); // use later if needed
      }
      requestAnimationFrame(pump);
    }

    startBtn.addEventListener('click', async () => {
      await startStream({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 60 } },
        audio: false
      });
    });

    camSel.addEventListener('change', async () => {
      currentDeviceId = camSel.value;
      await startStream({ video: { deviceId: { exact: currentDeviceId } }, audio: false });
    });

    stopBtn.addEventListener('click', stopStream);
    video.addEventListener('playing', () => requestAnimationFrame(pump));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') stopStream(); });
    window.addEventListener('pagehide', stopStream);

    // Snapshot as JPEG
    async function captureJpegFromVideo(video, {width, height, quality = 0.92} = {}) {
      const w = width  ?? video.videoWidth;
      const h = height ?? video.videoHeight;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cctx = c.getContext('2d');
      // If your preview is mirrored and you want un-mirrored files, flip here:
      // cctx.scale(-1, 1); cctx.drawImage(video, -w, 0, w, h); cctx.setTransform(1,0,0,1,0,0);
      cctx.drawImage(video, 0, 0, w, h);
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
      return blob;
    }
    async function downloadSnapshot(video) {
      const blob = await captureJpegFromVideo(video, { quality: 0.92 });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[:.]/g, '-');
      a.href = url; a.download = `frame-${ts}.jpg`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    document.getElementById('snap').addEventListener('click', () => downloadSnapshot(video));

    // Expose editor helpers globally if you want to call them from elsewhere:
    window.insertText = insertText;
    window.pressKey = pressKey;
    window.focusEditor = focusEditor;
  </script>
</body>
</html>
